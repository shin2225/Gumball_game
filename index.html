<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ガムボール・ボルケーノ</title>
<style>
  :root { --bg:#1b1220; --ink:#fbe9d0; --card:#2a1d30; --accent:#ff6a2b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:10px 16px 28px; min-height:100vh; }
  h1 { font-size:1.25rem; margin:6px 0 2px; letter-spacing:.05em; }
  #wrap { width:100%; max-width:380px; touch-action:none; }
  canvas { width:100%; height:auto; display:block; border-radius:14px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #msg { min-height:1.6em; text-align:center; font-weight:700; margin:8px 0 2px; }
  #stats { font-size:.85rem; opacity:.85; margin-bottom:8px; text-align:center; }
  #start { font:inherit; font-weight:700; font-size:1rem; padding:10px 22px; border-radius:999px; border:0;
           background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 3px 0 #a33a10; }
  #start:disabled { opacity:.4; cursor:default; }
  #help { font-size:.8rem; opacity:.75; max-width:380px; line-height:1.6; margin-top:12px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<h1>🌋 ガムボール・ボルケーノ</h1>
<div id="wrap"><canvas id="c" aria-label="ガムボール・ボルケーノ"></canvas></div>
<div id="msg">コインを入れてスタート！</div>
<div id="stats"></div>
<button id="start">100円入れる</button>
<div id="help">
  <b>あそびかた</b>：左右のハンドルで棒の両端を上げ下げして、ガムボールを光っている穴まで運ぼう。ほかの穴に落ちるとアウト（1プレイ3球）。<br>
  <b>操作</b>：画面の左半分／右半分を上下にドラッグ。キーボードなら 左＝<kbd>W</kbd>/<kbd>S</kbd>、右＝<kbd>↑</kbd>/<kbd>↓</kbd>。<br>
  ⑩の<b>火口</b>まで届けば大噴火！ガム大量ゲット。<br>
  <a href="gumball.html">→ ふつうのガムボールマシンはこちら</a>
</div>

<script>
(() => {
"use strict";
const W = 360, H = 640;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 3);
cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr,dpr);
const $msg = document.getElementById("msg"), $stats = document.getElementById("stats"), $start = document.getElementById("start");

// ---- 盤面 ----
const BX0 = 22, BX1 = 338;           // 棒の両端の x
const BOTTOM = 600, TOP = 70;        // 棒の可動範囲（y）
const MAXDIFF = 170;                 // 左右の高さ差の上限
const BR = 11, HR = 14;              // ボール半径・穴半径
const SPEED = 2.6;                   // ハンドル速度（px/frame）

// 再現性のある乱数で穴を配置
let seed = 20261116;
const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;

const targets = [];   // 1〜10番（10番が火口）
const holes = [];
for (let i=0;i<10;i++) {
  const y = 520 - i*46;
  const x = i===9 ? 180 : (i%2 ? 90 + rnd()*60 : 210 + rnd()*60);
  const h = { x, y: i===9 ? 92 : y, r: i===9 ? 17 : HR, target:i+1 };
  targets.push(h); holes.push(h);
}
const ok = (x,y) => holes.every(h => Math.hypot(h.x-x,h.y-y) > h.r + HR + 14);
for (let n=0; holes.length < 54 && n < 5000; n++) {
  const y = 105 + rnd()*430, x = 34 + rnd()*292;
  if (ok(x,y)) holes.push({ x, y, r:HR, target:0 });
}

// ---- 状態 ----
let save = { best:0, gums:0 };
try { Object.assign(save, JSON.parse(localStorage.getItem("volcano-save")||"{}")); } catch(e){}
const persist = () => { try { localStorage.setItem("volcano-save", JSON.stringify(save)); } catch(e){} };

const COLORS = ["#ff4f7b","#ffe14d","#5fdc7a","#4dc3ff","#a26bff","#ff9a3c"];
let playing = false, lives = 0, level = 1, won = 0;
let yl = BOTTOM, yr = BOTTOM, tl = BOTTOM, tr = BOTTOM;  // 現在値と目標値
let ball = null;           // {x, v, color}
let falling = null;        // 穴に落ちる演出 {x,y,t,hole,color}
let particles = [];
let flash = 0;
const keys = {};

function barY(x){ return yl + (yr-yl)*(x-BX0)/(BX1-BX0); }
function resetBar(){ yl = yr = tl = tr = BOTTOM; }
function newBall(){ resetBar(); ball = { x:180, v:0, color:COLORS[(Math.random()*COLORS.length)|0] }; }

// ---- 音 ----
let actx = null;
function beep(f, d=0.08, type="square", vol=0.05, slide=0){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f,t); if (slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d);
  } catch(e){}
}

// ---- 進行 ----
function start(){
  playing = true; lives = 3; level = 1; won = 0; particles = [];
  newBall(); $start.disabled = true;
  $msg.textContent = "①の穴をねらえ！"; beep(1200,0.06); setTimeout(()=>beep(1600,0.08),70);
  ui();
}
function onHole(h){
  if (h.target === level) {
    const prize = h.target === 10 ? 20 : 1;
    won += prize; save.gums += prize;
    if (h.target === 10) { erupt(); $msg.textContent = "🌋 大噴火！！ ガム20個ゲット！"; }
    else { $msg.textContent = `ナイス！ ${circ(level)} クリア → 次は ${circ(level+1)}`; beep(880,0.1,"triangle",0.07); setTimeout(()=>beep(1320,0.14,"triangle",0.07),90); }
    flash = 30;
    level++;
    if (level > 10) { save.best = Math.max(save.best, 10); persist(); return end(true); }
  } else {
    lives--;
    $msg.textContent = lives > 0 ? `ざんねん… のこり${lives}球` : "ゲームオーバー";
    beep(300,0.4,"sawtooth",0.05,60);
  }
  save.best = Math.max(save.best, level-1); persist();
  if (lives <= 0) return end(false);
  setTimeout(()=>{ if (playing) newBall(); }, 700);
  ui();
}
function end(clear){
  playing = false; ball = null; $start.disabled = false;
  $start.textContent = "もう1回（100円）";
  if (!clear) $msg.textContent = `ゲームオーバー：${circ(level)} まで到達、ガム${won}個`;
  else $msg.textContent = `🎉 完全制覇！ ガム${won}個ゲット！`;
  ui();
}
const circ = n => "①②③④⑤⑥⑦⑧⑨⑩"[n-1] || "";
function ui(){
  $stats.textContent = (playing ? `のこり ${lives}球　今回 ${won}個　` : "") + `ベスト ${circ(save.best)||"-"}　累計ガム ${save.gums}個`;
}
function erupt(){
  const c = targets[9];
  for (let i=0;i<70;i++) particles.push({ x:c.x, y:c.y, vx:(Math.random()-0.5)*7, vy:-4-Math.random()*8,
    r:5+Math.random()*5, color: i%3 ? COLORS[i%COLORS.length] : "#ff7a1a", life:140+Math.random()*60 });
  [0,120,240,360].forEach((d,i)=>setTimeout(()=>beep(200+i*150,0.25,"sawtooth",0.06,900),d));
}

// ---- 更新 ----
function update(){
  // キーボード
  if (keys.w) tl -= SPEED; if (keys.s) tl += SPEED;
  if (keys.up) tr -= SPEED; if (keys.down) tr += SPEED;
  tl = Math.max(TOP, Math.min(BOTTOM, tl)); tr = Math.max(TOP, Math.min(BOTTOM, tr));
  // 棒をなめらかに追従（最大速度あり）＋傾き上限
  const step = (cur, tgt) => cur + Math.max(-SPEED, Math.min(SPEED, tgt-cur));
  if (playing && ball) {
    yl = step(yl, tl); yr = step(yr, tr);
    if (yl - yr > MAXDIFF) { yl = yr + MAXDIFF; tl = Math.min(tl, yl); }
    if (yr - yl > MAXDIFF) { yr = yl + MAXDIFF; tr = Math.min(tr, yr); }
  }
  // ボールの転がり
  if (ball) {
    const m = (yr-yl)/(BX1-BX0);
    ball.v += 0.32 * m / Math.sqrt(1+m*m);
    ball.v *= 0.985;
    ball.x += ball.v;
    const lo = BX0+BR+4, hi = BX1-BR-4;
    if (ball.x < lo) { ball.x = lo; ball.v *= -0.3; }
    if (ball.x > hi) { ball.x = hi; ball.v *= -0.3; }
    const by = barY(ball.x) - BR - 3;
    for (const h of holes) {
      if (Math.hypot(h.x-ball.x, h.y-by) < h.r - 3) {
        falling = { x:ball.x, y:by, t:0, hole:h, color:ball.color };
        ball = null; break;
      }
    }
  }
  if (falling) {
    falling.t++;
    falling.x += (falling.hole.x - falling.x)*0.25; falling.y += (falling.hole.y - falling.y)*0.25;
    if (falling.t === 18) { const h = falling.hole; falling = null; onHole(h); }
  }
  for (const p of particles) { p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.life--; if (p.x<p.r||p.x>W-p.r) p.vx*=-0.7; }
  particles = particles.filter(p => p.life > 0 && p.y < H+20);
  if (flash) flash--;
}

// ---- 描画 ----
function circle(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function gum(x,y,r,color){
  circle(x,y,r,color);
  const g = ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);
  g.addColorStop(0,"rgba(255,255,255,.8)"); g.addColorStop(.35,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(0,0,0,.3)");
  circle(x,y,r,g);
}
function draw(){
  const t = performance.now()/1000;
  // 空
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#2a0f2e"); sky.addColorStop(.55,"#5a1d2a"); sky.addColorStop(1,"#1a0d0d");
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
  // 火山
  ctx.beginPath(); ctx.moveTo(-10,H); ctx.lineTo(140,92); ctx.lineTo(220,92); ctx.lineTo(W+10,H); ctx.closePath();
  const rock = ctx.createLinearGradient(0,90,0,H); rock.addColorStop(0,"#5b3a2e"); rock.addColorStop(1,"#2b1914");
  ctx.fillStyle = rock; ctx.fill();
  // 溶岩の筋
  ctx.strokeStyle = `rgba(255,${90+Math.sin(t*3)*30|0},30,.35)`; ctx.lineWidth = 6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(165,100); ctx.quadraticCurveTo(150,220,120,330); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(198,100); ctx.quadraticCurveTo(225,240,250,380); ctx.stroke();
  // 火口の光
  const c = targets[9], glow = ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,70);
  glow.addColorStop(0,`rgba(255,140,40,${level===10&&playing?0.9:0.5})`); glow.addColorStop(1,"rgba(255,80,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(c.x-80,c.y-80,160,160);

  // 穴
  for (const h of holes) {
    const isT = playing && h.target === level;
    if (isT) { const pr = h.r + 6 + Math.sin(t*6)*2.5; circle(h.x,h.y,pr,"rgba(255,230,90,.35)"); }
    circle(h.x,h.y,h.r+2, h.target===10 ? "#ff6a1a" : "rgba(0,0,0,.35)");
    circle(h.x,h.y,h.r, h.target===10 ? "#3a0800" : "#120807");
    if (h.target) {
      ctx.strokeStyle = isT ? "#ffe45a" : (h.target < level && playing ? "#5fdc7a" : "rgba(255,200,120,.5)");
      ctx.lineWidth = isT ? 3 : 2; ctx.beginPath(); ctx.arc(h.x,h.y,h.r+1,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = isT ? "#ffe45a" : "rgba(255,220,160,.8)"; ctx.font = "bold 12px system-ui"; ctx.textAlign="center";
      ctx.fillText(h.target===10 ? "火口" : circ(h.target), h.x, h.y - h.r - 6);
    }
  }
  // 落下中のボール
  if (falling) gum(falling.x, falling.y, BR*(1-falling.t/22), falling.color);

  // レール
  ctx.fillStyle = "#3b2a26"; ctx.fillRect(4,TOP-14,14,BOTTOM-TOP+30); ctx.fillRect(W-18,TOP-14,14,BOTTOM-TOP+30);
  // 棒
  ctx.strokeStyle = "#cfd6dc"; ctx.lineWidth = 6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(BX0-11,yl); ctx.lineTo(BX1+11,yr); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(BX0-11,yl-2); ctx.lineTo(BX1+11,yr-2); ctx.stroke();
  circle(11,yl,9,"#ff6a2b"); circle(W-11,yr,9,"#ff6a2b");
  // ボール
  if (ball) gum(ball.x, barY(ball.x)-BR-3, BR, ball.color);

  // 噴火パーティクル
  for (const p of particles) gum(p.x,p.y,p.r,p.color);
  if (flash) { ctx.fillStyle = `rgba(255,240,180,${flash/120})`; ctx.fillRect(0,0,W,H); }

  // ハンドル表示（下部）
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0,H-26,W,26);
  ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "12px system-ui"; ctx.textAlign="center";
  ctx.fillText("◀ 左ハンドル（W/S）", W*0.25, H-9); ctx.fillText("右ハンドル（↑/↓）▶", W*0.75, H-9);
  if (!playing) {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0,H/2-40,W,80);
    ctx.fillStyle = "#ffd36b"; ctx.font = "bold 22px system-ui"; ctx.fillText("GUMBALL VOLCANO", W/2, H/2-4);
    ctx.fillStyle = "#fff"; ctx.font = "13px system-ui"; ctx.fillText("下のボタンでコインを入れてね", W/2, H/2+20);
  }
}

// ---- 入力 ----
const drags = new Map();   // pointerId -> {side, lastY}
function py(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height }; }
cv.addEventListener("pointerdown", e => {
  if (!playing) return;
  const p = py(e); drags.set(e.pointerId, { side: p.x < W/2 ? "l" : "r", lastY: p.y });
  cv.setPointerCapture(e.pointerId); e.preventDefault();
});
cv.addEventListener("pointermove", e => {
  const d = drags.get(e.pointerId); if (!d) return;
  const p = py(e), dy = (p.y - d.lastY) * 1.0; d.lastY = p.y;
  if (d.side === "l") tl = Math.max(TOP, Math.min(BOTTOM, tl + dy)); else tr = Math.max(TOP, Math.min(BOTTOM, tr + dy));
});
const up = e => drags.delete(e.pointerId);
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

const KEYMAP = { w:"w", s:"s", W:"w", S:"s", ArrowUp:"up", ArrowDown:"down" };
addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k) { keys[k] = true; e.preventDefault(); }
  if ((e.key===" "||e.key==="Enter") && !playing) start(); });
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
$start.onclick = start;

(function loop(){ update(); draw(); requestAnimationFrame(loop); })();
ui();
})();
</script>
</body>
</html>
